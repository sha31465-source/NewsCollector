  - "众筹"
  - "预订"
  - "预购"

# ========================================
# 去重与过滤设置（增强版）
# ========================================
deduplication_settings:
  # 相似度阈值（降低以提高召回率）
  #   - 0.90: 极严格（只拦截几乎完全相同的标题）
  #   - 0.85: 严格（拦截高度相似的标题）
  #   - 0.80: 中等（拦截前缀/后缀不同的标题）【推荐】
  #   - 0.75: 宽松（拦截内容相似但表述不同的标题）
  similarity_threshold: 0.80

  # 相似度计算方法
  method: jaccard

  # 【关键】是否启用标题去重（必须启用）
  enable_title_dedup: true

  # 是否启用内容去重（性能消耗大，谨慎开启）
  enable_content_dedup: false

  # 语义去重的最小内容长度
  min_length_for_semantic_dedup: 50

  # 【新增】查重时间窗口（天）
  # 代码已修改为支持90天窗口，拦截周期性新闻和"炒冷饭"
  deduplication_window_days: 90

