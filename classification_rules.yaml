# ============================================================
# 企业级资讯分类规则配置 V3.1 - 精简版
# ============================================================
# 说明：高门槛配置，大幅减少冗余内容
# 版本：V3.1 (2026-04-01)
# ============================================================

# ========================================
# 全局设置
# ========================================
global_settings:
  # 全局最低门槛分（提升到20，V3.1温和精简）
  # 说明：必须标题+内容同时命中，或命中多个关键词才能过线
  min_score_threshold: 20

  # 标题权重倍数（标题中的关键词更重要）
  title_weight_multiplier: 2.0

  # 内容权重倍数（内容中的关键词权重）
  content_weight_multiplier: 1.0

  # 最低匹配关键词数（至少匹配几个不同关键词）
  min_keyword_matches: 2

  # 来源信任度加分（权威来源直接加分）
  source_trust_weights:
    "Nature": 5.0           # Nature系列直接加5分
    "Science": 5.0          # Science直接加5分
    "JAMA": 5.0             # JAMA直接加5分
    "NEJM": 5.0             # 新英格兰医学杂志
    "Lancet": 5.0           # 柳叶刀
    "Cell": 5.0             # Cell
    "PNAS": 4.0             # 美国科学院院刊
    "Nature Reviews": 5.0   # Nature综述系列
    "Science Daily": 4.0    # 提升科学日报权重
    "Medical Xpress": 3.0   # 提升Medical Xpress权重
    "Frontiers": 3.0        # 提升Frontiers权重
    "PLOS": 3.0             # PLOS系列
    "PubMed": 4.0           # PubMed
    "NIH": 4.0              # 美国国立卫生研究院
    "WHO": 4.0              # 世界卫生组织
    "MIT": 3.0              # MIT相关
    "Harvard": 3.0          # 哈佛相关
    "Stanford": 3.0         # 斯坦福相关
    "Oxford": 3.0           # 牛津相关
    "Cambridge": 3.0        # 剑桥相关
    "EurekAlert!": 4.0      # 科学新闻发布平台
    "Phys.org": 3.5         # 物理科学资讯
    "MedicalXpress": 3.0    # 医学科学资讯
    "TechXplore": 3.0       # 技术探索
    "ArXiv": 4.0            # 预印本论文库
    "bioRxiv": 4.0          # 生物学预印本
    "Nature World News": 3.5 # 自然相关新闻
    "IEEE Spectrum": 4.0    # IEEE官方媒体
    "ACS Nano": 4.0         # 美国化学学会纳米
    "Springer": 3.5         # 施普林格出版
    "Wiley": 3.5            # 威利出版
    "Taylor & Francis": 3.5  # 泰勒弗朗西斯
    "ASM": 3.5              # 美国微生物学会
    "ACS": 4.0              # 美国化学学会
    "APS": 4.0              # 美国物理学会
    "AHA": 3.5              # 美国心脏协会
    "ESC": 3.5              # 欧洲心脏病学会
    "Variety": 3.5          # Variety - 权威娱乐产业媒体

  # 【新增】白名单配置（指定来源可以绕过某些黑名单规则）
  whitelist:
    # Variety.com - 权威娱乐产业新闻，允许包含 celebrity 等关键词
    - source: "Variety"
      # 允许的黑名单关键词（这些关键词将不会过滤此来源的内容）
      allowed_keywords:
        - "celebrity"
        - "celeb"
      # 说明：Variety 是好莱坞权威媒体，虽然包含 celebrity 但内容质量高
      reason: "权威娱乐产业媒体"

# ========================================
# 硬屏蔽词列表（直接过滤，不进入分类流程）
# ========================================
# 修正：提高精度，避免误杀学术/产业资讯
